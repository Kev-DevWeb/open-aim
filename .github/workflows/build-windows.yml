# Builds the Windows installer (AimTrainer-Setup.exe) and the portable AimTrainer.exe.
# Download them from the run's "Artifacts" section on the Actions tab.
name: Build Windows installer

on:
  push:
    branches: [claude/gifted-curie-b419oi]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Check drills and run tests
        run: |
          npm run check
          npm run test:weapon
          npm run test:import
          npm run test:updates

      - name: Build installer
        run: npm run build
        env:
          # No code-signing certificate: build unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: AimTrainer-windows
          path: |
            app/dist/AimTrainer-Setup.exe
            app/dist/AimTrainer.exe
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
